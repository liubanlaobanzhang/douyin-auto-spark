name: 🚀 续一次火

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,2,4 * * *"
      timezone: "Asia/Shanghai"

permissions:
  actions: read
  contents: read

jobs:
  check:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-22.04
    outputs:
      should_run: ${{ steps.daily-check.outputs.should_run }}
      is_retry: ${{ steps.daily-check.outputs.is_retry }}

    steps:
      - name: 检查当天是否已有成功运行 (Check today's successful run)
        id: daily-check
        uses: actions/github-script@v8
        with:
          script: |
            const now = new Date();
            const beijingNow = new Date(now.getTime() + 8 * 60 * 60 * 1000);
            const beijingDate = beijingNow.toISOString().slice(0, 10);
            const dayStart = new Date(`${beijingDate}T00:00:00+08:00`);
            const dayEnd = new Date(dayStart.getTime() + 24 * 60 * 60 * 1000);

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'renew-fire.yml',
              per_page: 100,
            });

            const previousRunsToday = data.workflow_runs.filter((run) => {
              if (run.id === Number(context.runId)) return false;
              const createdAt = new Date(run.created_at);
              return createdAt >= dayStart && createdAt < dayEnd;
            });
            const hasSuccessfulRun = previousRunsToday.some(
              (run) => run.conclusion === 'success',
            );
            const isRetry = !hasSuccessfulRun && previousRunsToday.length > 0;

            core.setOutput('should_run', hasSuccessfulRun ? 'false' : 'true');
            core.setOutput('is_retry', isRetry ? 'true' : 'false');
            core.info(
              `Beijing date ${beijingDate}: previous runs=${previousRunsToday.length}, successful=${hasSuccessfulRun}, retry=${isRetry}`,
            );

  run:
    needs: check
    if: ${{ always() && (github.event_name != 'schedule' || needs.check.outputs.should_run == 'true') }}
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    timeout-minutes: 30
    # 允许 GITHUB_TOKEN 推送 screenshots 图床分支
    permissions:
      contents: write

    steps:
      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v7

      - name: 安装 unzip (Install unzip)
        run: apt-get update && apt-get install -y unzip

      - name: 安装 Bun (Set up Bun)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装运行时依赖 (Install dependencies)
        run: |
          bun install --production --ignore-scripts

      - name: 获取当前公网 IP (Resolve public IP)
        id: ip
        run: |
          echo "value=$(curl -4 -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: 续一次火 (Run spark job)
        env:
          # DOUYIN_ACCOUNTS 仅用于兼容历史配置；新多账号配置请使用编号分片。
          DOUYIN_ACCOUNTS: ${{ secrets.DOUYIN_ACCOUNTS }}
          DOUYIN_ACCOUNTS_1: ${{ secrets.DOUYIN_ACCOUNTS_1 }}
          DOUYIN_ACCOUNTS_2: ${{ secrets.DOUYIN_ACCOUNTS_2 }}
          DOUYIN_ACCOUNTS_3: ${{ secrets.DOUYIN_ACCOUNTS_3 }}
          DOUYIN_ACCOUNTS_4: ${{ secrets.DOUYIN_ACCOUNTS_4 }}
          DOUYIN_ACCOUNTS_5: ${{ secrets.DOUYIN_ACCOUNTS_5 }}
          DOUYIN_ACCOUNTS_6: ${{ secrets.DOUYIN_ACCOUNTS_6 }}
          DOUYIN_ACCOUNTS_7: ${{ secrets.DOUYIN_ACCOUNTS_7 }}
          DOUYIN_ACCOUNTS_8: ${{ secrets.DOUYIN_ACCOUNTS_8 }}
          DOUYIN_ACCOUNTS_9: ${{ secrets.DOUYIN_ACCOUNTS_9 }}
          DOUYIN_ACCOUNTS_10: ${{ secrets.DOUYIN_ACCOUNTS_10 }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DOUYIN_TARGET_NAMES: ${{ secrets.DOUYIN_TARGET_NAMES }}
          YIYAN_INCLUDE_SOURCE: ${{ secrets.YIYAN_INCLUDE_SOURCE }}
          SPARK_MESSAGE_TEMPLATE: ${{ secrets.SPARK_MESSAGE_TEMPLATE }} \n IP：${{ steps.ip.outputs.value }}
        run: | 
          echo ${{ secrets.SPARK_MESSAGE_TEMPLATE }}
          bun src/main.ts

      - name: 上传失败截图到仓库图床 (Upload failure screenshots)
        if: ${{ failure() && env.FTQQ_SENDKEY != '' }}
        env:
          FTQQ_SENDKEY: ${{ secrets.FTQQ_SENDKEY }}
          TZ: Asia/Shanghai
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 通过 GitHub REST API 把截图直传仓库 screenshots 分支（图床），不依赖本地 git 仓库
          python3 - <<'PYEOF'
          import base64
          import datetime
          import glob
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          run_id = os.environ["GITHUB_RUN_ID"]
          env_file = os.environ["GITHUB_ENV"]
          api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          branch = "screenshots"
          retention_days = 14
          api = f"{api_base}/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "douyin-auto-spark",
          }

          def req(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as resp:
                      body = resp.read().decode()
                      return resp.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as error:
                  body = error.read().decode()
                  try:
                      return error.code, json.loads(body)
                  except Exception:
                      return error.code, {}

          files = sorted(glob.glob("artifacts/*.png"))
          if not files:
              with open(env_file, "a", encoding="utf-8", newline="\n") as f:
                  f.write("SCREENSHOT_MARKDOWN=\n")
              print("没有失败截图，跳过图床上传")
              sys.exit(0)

          today = datetime.datetime.now().strftime("%Y-%m-%d")

          # 图床分支不存在时，基于默认分支创建
          status, data = req("GET", f"{api}/branches/{branch}")
          if status == 404:
              status, data = req("GET", f"{api}")
              default_branch = data["default_branch"]
              status, data = req("GET", f"{api}/git/ref/heads/{default_branch}")
              status, data = req(
                  "POST",
                  f"{api}/git/refs",
                  {"ref": f"refs/heads/{branch}", "sha": data["object"]["sha"]},
              )
              if status not in (200, 201):
                  print("创建图床分支失败:", status, data)
                  sys.exit(1)
              print("已创建图床分支:", branch)

          # 逐张上传截图（扁平结构：文件名自带日期与运行 ID，便于按日期清理）
          for path in files:
              name = os.path.basename(path)
              remote_name = f"{today}-run-{run_id}-{name}"
              remote_path = f"screenshots/{remote_name}"
              with open(path, "rb") as f:
                  content = base64.b64encode(f.read()).decode()
              status, data = req(
                  "PUT",
                  f"{api}/contents/{urllib.parse.quote(remote_path, safe='/')}",
                  {
                      "message": f"chore: 上传失败截图 run-{run_id}",
                      "content": content,
                      "branch": branch,
                  },
              )
              if status not in (200, 201):
                  print("上传截图失败:", status, data)
                  sys.exit(1)
              print("已上传:", remote_path)

          # 清理超过保留期的截图（文件名前 10 位是日期 YYYY-MM-DD）
          cutoff = datetime.date.today() - datetime.timedelta(days=retention_days)
          status, data = req("GET", f"{api}/contents/screenshots?ref={branch}")
          if status == 200 and isinstance(data, list):
              for entry in data:
                  name = entry.get("name", "")
                  try:
                      day_date = datetime.date.fromisoformat(name[:10])
                  except ValueError:
                      continue
                  if day_date >= cutoff:
                      continue
                  file_path = entry["path"]
                  status, _ = req(
                      "DELETE",
                      f"{api}/contents/{urllib.parse.quote(file_path, safe='/')}",
                      {
                          "message": f"chore: 清理过期截图 {name[:10]}",
                          "branch": branch,
                          "sha": entry["sha"],
                      },
                  )
                  if status in (200, 202):
                      print("已清理:", file_path)

          # 生成 Markdown 图片语法写入环境变量，供微信推送正文引用
          parts = []
          for path in files:
              name = os.path.basename(path)
              quoted = urllib.parse.quote(f"{today}-run-{run_id}-{name}")
              raw_url = f"https://raw.githubusercontent.com/{repo}/{branch}/screenshots/{quoted}"
              cdn_url = f"https://cdn.jsdelivr.net/gh/{repo}@{branch}/screenshots/{quoted}"
              parts.append(f"![{name}]({raw_url})\n\n[备用线路查看]({cdn_url})")
          content = "\n\n".join(parts)
          with open(env_file, "a", encoding="utf-8", newline="\n") as f:
              f.write(f"SCREENSHOT_MARKDOWN<<SCREENSHOT_EOF\n{content}\nSCREENSHOT_EOF\n")
          print(f"已生成 {len(files)} 张截图的微信推送内容")
          PYEOF

      - name: 发送构建失败通知
        # 手动触发的运行跳过微信通知（测试时避免打扰）
        if: ${{ failure() && env.FTQQ_SENDKEY != '' }}
        env:
          FTQQ_SENDKEY: ${{ secrets.FTQQ_SENDKEY }}
          TZ: Asia/Shanghai
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os
          import time
          import urllib.parse
          import urllib.request

          def fetch(url):
              try:
                  with urllib.request.urlopen(url, timeout=10) as resp:
                      return resp.read().decode().strip()
              except Exception:
                  return None

          ipv4 = fetch("https://api.ipify.org") or "未知"
          ipv6 = fetch("https://api64.ipify.org") or "无 IPv6"

          desp = "\n\n".join([
              f"执行时间：{time.strftime('%Y-%m-%d %H:%M:%S', time.localtime())}",
              f"IPv4：{ipv4}",
              f"IPv6：{ipv6}",
              f"分支：{os.environ['REF_NAME']}",
              f"提交：{os.environ['COMMIT_SHA']}",
              f"详情：{os.environ['RUN_URL']}",
          ])

          title = "可能未能正常续火花"
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              title += "【手动触发】"
              desp += "\n\n【手动触发】"

          # 失败时把图床分支上的截图以 Markdown 图片嵌入推送正文
          screenshot_markdown = os.environ.get("SCREENSHOT_MARKDOWN", "").strip()
          if screenshot_markdown:
              desp += "\n\n### 失败现场截图\n\n" + screenshot_markdown

          data = urllib.parse.urlencode({"title": title, "desp": desp}).encode()
          req = urllib.request.Request(
              f"https://sctapi.ftqq.com/{os.environ['FTQQ_SENDKEY']}.send", data=data
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print(resp.read().decode())
          PYEOF

      - name: 发送构建成功通知
        # 手动触发的运行跳过微信通知（测试时避免打扰）
        if: ${{ success() && env.FTQQ_SENDKEY != '' && env.EVENT_NAME != 'workflow_dispatch' }}
        env:
          FTQQ_SENDKEY: ${{ secrets.FTQQ_SENDKEY }}
          TZ: Asia/Shanghai
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os
          import time
          import urllib.parse
          import urllib.request

          def fetch(url):
              try:
                  with urllib.request.urlopen(url, timeout=10) as resp:
                      return resp.read().decode().strip()
              except Exception:
                  return None

          ipv4 = fetch("https://api.ipify.org") or "未知"
          ipv6 = fetch("https://api64.ipify.org") or "无 IPv6"

          desp = "\n\n".join([
              f"执行时间：{time.strftime('%Y-%m-%d %H:%M:%S', time.localtime())}",
              f"IPv4：{ipv4}",
              f"IPv6：{ipv6}",
              f"分支：{os.environ['REF_NAME']}",
              f"提交：{os.environ['COMMIT_SHA']}",
              f"详情：{os.environ['RUN_URL']}",
          ])

          title = "已完成今日自动续火花任务"
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              title += "【手动触发】"
              desp += "\n\n【手动触发】"

          data = urllib.parse.urlencode({"title": title, "desp": desp}).encode()
          req = urllib.request.Request(
              f"https://sctapi.ftqq.com/{os.environ['FTQQ_SENDKEY']}.send", data=data
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print(resp.read().decode())
          PYEOF

